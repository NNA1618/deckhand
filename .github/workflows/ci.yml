name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Use the newest Xcode
        run: |
          XCODE=$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)
          sudo xcode-select -s "$XCODE"
          swift --version
          # Liquid Glass is compiled in only with the macOS 26 SDK
          SDK=$(xcrun --sdk macosx --show-sdk-version)
          echo "macOS SDK $SDK"
          [ "${SDK%%.*}" -ge 26 ] || { echo "error: macOS 26 SDK or newer required, got $SDK"; exit 1; }
      - name: Build the app
        run: NO_INSTALL=1 SIGN_ID=- ./scripts/bundle.sh release
      - name: Self-test
        run: .build/release/Deckhand.app/Contents/MacOS/Deckhand --selftest
      - name: Russian translation
        run: |
          plutil -lint Localization/ru.lproj/Localizable.strings
          python3 scripts/l10n-check.py .
